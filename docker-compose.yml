version: '3.9'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5555:5555"
    environment:
      - PORT=5555
      - MONGO_URI=mongodb+srv://furqanjee:furqan321@cluster0.6dozg9x.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
